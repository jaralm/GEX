name: MEFF Daily Pipeline

on:
  schedule:
    - cron: '0 12 * * 2,3,4,5,6'   # martes-sabado a las 06:00 UTC
  workflow_dispatch:          # permite lanzarlo manual cuando se quiera desde GitHub

permissions:
  contents: write             # necesario para el commit y push de datos

jobs:
  meff-daily:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pandas numpy

      - name: Ejecutar pipeline MEFF
        env:
          EMAIL_ORIGEN:  ${{ secrets.EMAIL_ORIGEN }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          PASSWORD_APP:  ${{ secrets.PASSWORD_APP }}
        run: python3 run_meff_daily.py

      - name: Commit y push de datos nuevos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "datos MEFF $(date +'%Y-%m-%d')"
          git push
