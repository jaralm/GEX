name: MEFF Daily Pipeline

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  meff-daily:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pandas numpy

      - name: Ejecutar pipeline MEFF
        env:
          EMAIL_ORIGEN:  ${{ secrets.EMAIL_ORIGEN }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          PASSWORD_APP:  ${{ secrets.PASSWORD_APP }}
        run: python3 run_meff_daily.py

      - name: Commit y push de datos nuevos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "datos MEFF $(date +'%Y-%m-%d')"
          # Push con hasta 3 intentos: si GitHub falla de forma puntual
          # (p. ej. "fatal error in commit_refs"), espera, rebasa y reintenta.
          for intento in 1 2 3; do
            if git push; then
              echo "Push correcto en el intento $intento"
              exit 0
            fi
            echo "Push fallido (intento $intento). Reintentando en $((intento * 20)) s..."
            sleep $((intento * 20))
            git pull --rebase origin main || true
          done
          echo "Push fallido tras 3 intentos"
          exit 1
